[package]
name = "bpm-key-tool"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rfd = "0.15"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "flac",
    "isomp4",
    "mp3",
    "pcm",
    "wav",
] }
